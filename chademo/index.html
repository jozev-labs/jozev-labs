<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAdeMO Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  /* Layout: header, map across the top, then a chooser list beside a detail panel (stacked on phones). */
  :root {
    --bg: #f5f7f6;
    --panel: #ffffff;
    --fg: #14211f;
    --muted: #5b6b68;
    --line: #d6dedc;
    --accent: #0b6b61;
    --accent-fg: #ffffff;
    --sel: #e3f1ee;
    --ok: #17803d;
    --warn: #a15c00;
    --bad: #b42318;
    --code-bg: #eaf0ee;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1716;
      --panel: #172220;
      --fg: #e6efed;
      --muted: #9bb0ab;
      --line: #2b3b38;
      --accent: #4fc3b4;
      --accent-fg: #06201c;
      --sel: #1e3733;
      --ok: #5fd08a;
      --warn: #f0b255;
      --bad: #ff8a80;
      --code-bg: #1d2b29;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); max-width: 68ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .bar label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button.act {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 7px 12px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  }
  button.act.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: progress; }
  :is(button, select, summary, a, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { min-height: 1.5em; font-size: 14px; }
  .status.err { color: var(--bad); }
  #map { height: 56vh; min-height: 340px; border: 1px solid var(--line); border-radius: 10px; z-index: 0; }
  .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  ul.list { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow-y: auto; }
  ul.list li + li { border-top: 1px solid var(--line); }
  .item { all: unset; box-sizing: border-box; display: grid; gap: 2px; width: 100%; padding: 10px 14px; cursor: pointer; }
  .item:hover { background: var(--sel); }
  .item[aria-pressed="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item .t { font-weight: 600; }
  .item .m { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .dist { font-family: var(--mono); white-space: nowrap; }
  .detail { padding: 16px; display: grid; gap: 10px; }
  .detail h2 { margin: 0; font-size: 18px; }
  .addr, .hint { color: var(--muted); font-size: 14px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  tr.cha td { font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; }
  a { color: var(--accent); }
  details { padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  pre { margin: 10px 0 0; padding: 12px; background: var(--code-bg); border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .placeholder { padding: 18px 16px; color: var(--muted); }
</style>
  <script data-goatcounter="https://loodico.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<main>
  <header>
    <h1>CHAdeMO Finder</h1>
    <p class="sub">CHAdeMO connector around you, for Outlander PHEV.</p>
  </header>

  <div class="bar">
    <label for="radius">Radius
      <select id="radius">
        <option value="5">5 km</option>
        <option value="10">10 km</option>
        <option value="25" selected>25 km</option>
        <option value="50">50 km</option>
      </select>
    </label>
    <label for="hideOut"><input id="hideOut" type="checkbox" checked> Hide chargers reported out of service</label>
    <button class="act" id="mapCenter" type="button">Search around map center</button>
    <button class="act ghost" id="locate" type="button">Use my location</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div id="map" aria-label="Map of CHAdeMO chargers"></div>

  <div class="split">
    <section class="panel" aria-label="Charge points, nearest first">
      <ul id="list" class="list"><li class="placeholder">Results appear here once the search runs.</li></ul>
    </section>
    <section id="detail" class="panel detail" aria-live="polite">
      <div class="placeholder" style="padding:0">Select a charge point on the map or in the list to see its data.</div>
    </section>
  </div>

  <details class="panel" id="dev" hidden>
    <summary>Developer view: request and raw response</summary>
    <pre id="req"></pre>
    <pre id="raw"></pre>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  
  var OCM_API_KEY_B64 = "ZjNkMWMyY2ItMDAxZS00NzY3LTk1N2EtZGZjNGI4MDMxYjI2";

  function readKey() {
    try {
      var k = atob(OCM_API_KEY_B64.trim());
      return /^[A-Za-z0-9-]{8,}$/.test(k) ? k : "";
    } catch (e) {
      return "";
    }
  }

  var FALLBACK = { lat: 51.9225, lon: 4.4792, name: "central Rotterdam" };
  var CHADEMO = 2; // Open Charge Map connection type id for CHAdeMO
  var COLORS = { ok: "#17803d", warn: "#c77700", bad: "#c62828" };

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function setStatus(text, isErr) {
    var s = $("status");
    s.textContent = text;
    s.className = "status" + (isErr ? " err" : "");
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function tone(poi) {
    var st = poi.StatusType;
    return st && st.IsOperational === true ? "ok" : (st && st.IsOperational === false ? "bad" : "warn");
  }

  if (typeof L === "undefined") {
    setStatus("The map library did not load. Check your connection and reload.", true);
    return;
  }

  var map = L.map("map").setView([FALLBACK.lat, FALLBACK.lon], 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);

  var origin = { lat: FALLBACK.lat, lon: FALLBACK.lon };
  var originMarker = L.circleMarker([origin.lat, origin.lon], {
    radius: 8, color: "#ffffff", weight: 3, fillColor: "#1769e0", fillOpacity: 1
  }).addTo(map).bindTooltip("Search point");
  var markers = {};   // poi id -> marker
  var items = {};     // poi id -> list button
  var pois = {};      // poi id -> poi data
  var selectedId = null;
  var layer = L.layerGroup().addTo(map);

  function setOrigin(lat, lon) {
    origin = { lat: lat, lon: lon };
    originMarker.setLatLng([lat, lon]);
  }

  function chademoRows(poi) {
    return (poi.Connections || []).filter(function (c) {
      return c.ConnectionTypeID === CHADEMO || (c.ConnectionType && c.ConnectionType.ID === CHADEMO);
    });
  }
  function maxKw(rows) {
    var kw = 0;
    rows.forEach(function (c) { if (typeof c.PowerKW === "number" && c.PowerKW > kw) kw = c.PowerKW; });
    return kw;
  }

  function styleMarker(id) {
    var m = markers[id];
    if (!m) return;
    var sel = id === selectedId;
    m.setStyle({
      radius: sel ? 12 : 8,
      weight: sel ? 4 : 2,
      color: sel ? "#14211f" : "#ffffff",
      fillColor: COLORS[tone(pois[id])],
      fillOpacity: 0.95
    });
    if (sel) m.bringToFront();
  }

  function select(id, panMap) {
    var prev = selectedId;
    selectedId = id;
    if (prev !== null && items[prev]) items[prev].setAttribute("aria-pressed", "false");
    if (items[id]) {
      items[id].setAttribute("aria-pressed", "true");
      items[id].scrollIntoView({ block: "nearest" });
    }
    if (prev !== null) styleMarker(prev);
    styleMarker(id);
    if (panMap && markers[id]) map.panTo(markers[id].getLatLng());
    renderDetail(pois[id]);
  }

  function addRow(dl, label, value) {
    if (value === undefined || value === null || value === "") return;
    dl.appendChild(el("dt", null, label));
    dl.appendChild(el("dd", null, String(value)));
  }

  function renderDetail(poi) {
    var box = $("detail");
    box.textContent = "";
    var a = poi.AddressInfo || {};
    box.appendChild(el("h2", null, a.Title || "Unnamed charge point"));
    var addr = [a.AddressLine1, a.AddressLine2, a.Postcode, a.Town, a.StateOrProvince].filter(Boolean).join(", ");
    if (addr) box.appendChild(el("div", "addr", addr));

    var st = poi.StatusType;
    var pillWrap = el("div");
    var pill = el("span", "pill " + tone(poi), st && st.Title ? st.Title : "Status unknown");
    pillWrap.appendChild(pill);
    if (typeof a.Distance === "number") {
      var d = el("span", "hint", "  " + a.Distance.toFixed(1) + " km from the search point");
      pillWrap.appendChild(d);
    }
    box.appendChild(pillWrap);

    var dl = el("dl");
    var cha = chademoRows(poi);
    addRow(dl, "CHAdeMO", cha.length ? (maxKw(cha) ? "up to " + maxKw(cha) + " kW" : "power not listed") : "");
    addRow(dl, "Charge points", poi.NumberOfPoints);
    addRow(dl, "Operator", poi.OperatorInfo && poi.OperatorInfo.Title);
    addRow(dl, "Access", poi.UsageType && poi.UsageType.Title);
    if (poi.UsageType) {
      if (poi.UsageType.IsMembershipRequired) addRow(dl, "Membership", "Required");
      if (poi.UsageType.IsAccessKeyRequired) addRow(dl, "Access key", "Required");
    }
    addRow(dl, "Cost", poi.UsageCost);
    addRow(dl, "Phone", a.ContactTelephone1);
    addRow(dl, "Data provider", poi.DataProvider && poi.DataProvider.Title);
    if (poi.DateLastStatusUpdate) {
      var dt = new Date(poi.DateLastStatusUpdate);
      if (!isNaN(dt)) addRow(dl, "Status updated", dt.toISOString().slice(0, 10));
    }
    if (poi.GeneralComments) addRow(dl, "Notes", poi.GeneralComments);
    box.appendChild(dl);

    var conns = poi.Connections || [];
    if (conns.length) {
      var wrap = el("div", "tablewrap");
      var table = el("table");
      var head = el("tr");
      ["Connector", "Power", "Current", "Qty", "Status"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(head);
      conns.forEach(function (c) {
        var isCha = c.ConnectionTypeID === CHADEMO || (c.ConnectionType && c.ConnectionType.ID === CHADEMO);
        var tr = el("tr", isCha ? "cha" : "");
        tr.appendChild(el("td", null, (c.ConnectionType && c.ConnectionType.Title) || ("Type " + c.ConnectionTypeID)));
        tr.appendChild(el("td", null, typeof c.PowerKW === "number" ? c.PowerKW + " kW" : "-"));
        tr.appendChild(el("td", null, (c.CurrentType && c.CurrentType.Title) || "-"));
        tr.appendChild(el("td", null, typeof c.Quantity === "number" ? c.Quantity : "-"));
        tr.appendChild(el("td", null, (c.StatusType && c.StatusType.Title) || "-"));
        table.appendChild(tr);
      });
      wrap.appendChild(table);
      box.appendChild(wrap);
    }

    var links = el("div", "links");
    if (typeof a.Latitude === "number" && typeof a.Longitude === "number") {
      var g = el("a", null, "Directions");
      g.href = "https://www.google.com/maps/dir/?api=1&destination=" + a.Latitude + "," + a.Longitude;
      g.target = "_blank"; g.rel = "noopener";
      links.appendChild(g);
    }
    if (poi.ID) {
      var o = el("a", null, "Open Charge Map page");
      o.href = "https://map.openchargemap.io/?id=" + encodeURIComponent(poi.ID);
      o.target = "_blank"; o.rel = "noopener";
      links.appendChild(o);
    }
    var site = safeUrl(a.RelatedURL);
    if (site) {
      var w = el("a", null, "Operator website");
      w.href = site; w.target = "_blank"; w.rel = "noopener noreferrer";
      links.appendChild(w);
    }
    box.appendChild(links);
  }

  function clearResults() {
    layer.clearLayers();
    markers = {}; items = {}; pois = {}; selectedId = null;
    $("list").textContent = "";
    $("detail").textContent = "";
    $("detail").appendChild(el("div", "placeholder", "Select a charge point on the map or in the list to see its data.")).style.padding = "0";
  }

  async function search() {
    var key = readKey();
    if (!key) {
      setStatus("NO key , no fun..no glory!!!", true);
      return;
    }
    var km = parseFloat($("radius").value);
    var params = new URLSearchParams({
      output: "json", latitude: origin.lat, longitude: origin.lon, distance: km, distanceunit: "KM",
      connectiontypeid: CHADEMO, maxresults: 60, compact: "false", verbose: "false", key: key
    });
    var url = "https://api.openchargemap.io/v3/poi/?" + params.toString();
    var shown = url.replace(encodeURIComponent(key), "YOUR_KEY");

    $("mapCenter").disabled = true;
    clearResults();
    setStatus("Searching within " + km + " km...", false);
    var t0 = performance.now(), res, text;
    try {
      res = await fetch(url);
      text = await res.text();
    } catch (e) {
      $("mapCenter").disabled = false;
      setStatus("Could not reach the Open Charge Map API. Check your connection and try again.", true);
      return;
    }
    $("mapCenter").disabled = false;
    $("req").textContent = "GET " + shown + "\n-> HTTP " + res.status + " in " + Math.round(performance.now() - t0) + " ms";
    $("dev").hidden = false;

    if (!res.ok) {
      $("raw").textContent = text.slice(0, 1500);
      setStatus(res.status === 401 || res.status === 403 ? "The API rejected the key (HTTP " + res.status + "). Check it was pasted in full."
        : res.status === 429 ? "Too many requests (HTTP 429). Wait a minute and try again."
        : "The API returned HTTP " + res.status + ".", true);
      return;
    }
    var data;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!Array.isArray(data)) { $("raw").textContent = text.slice(0, 1500); setStatus("The API answered, but the response was not a list.", true); return; }
    $("raw").textContent = data.length ? "First of " + data.length + " results:\n" + JSON.stringify(data[0], null, 2).slice(0, 6000) : "[]";

    var list = $("hideOut").checked
      ? data.filter(function (p) { return !(p.StatusType && p.StatusType.IsOperational === false); })
      : data;
    var hidden = data.length - list.length;
    if (!list.length) {
      $("list").appendChild(el("li", "placeholder", "No CHAdeMO chargers in range. New CHAdeMO installs are rare in Europe, so try a larger radius."));
      setStatus("No CHAdeMO chargers within " + km + " km.", false);
      return;
    }

    var bounds = L.latLngBounds([[origin.lat, origin.lon]]);
    var frag = document.createDocumentFragment();
    list.forEach(function (poi) {
      var a = poi.AddressInfo || {};
      if (typeof a.Latitude !== "number" || typeof a.Longitude !== "number") return;
      var id = poi.ID;
      pois[id] = poi;
      var m = L.circleMarker([a.Latitude, a.Longitude], { radius: 8 }).addTo(layer);
      m.bindTooltip(a.Title || "Charge point");
      m.on("click", function () { select(id, false); });
      markers[id] = m;
      styleMarker(id);
      bounds.extend([a.Latitude, a.Longitude]);

      var li = el("li");
      var b = el("button", "item");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.appendChild(el("span", "t", a.Title || "Unnamed charge point"));
      var meta = el("span", "m");
      var kw = maxKw(chademoRows(poi));
      meta.appendChild(el("span", null, [a.Town, kw ? kw + " kW" : null, poi.StatusType && poi.StatusType.Title].filter(Boolean).join(" · ")));
      meta.appendChild(el("span", "dist", typeof a.Distance === "number" ? a.Distance.toFixed(1) + " km" : ""));
      b.appendChild(meta);
      b.addEventListener("click", function () { select(id, true); });
      items[id] = b;
      li.appendChild(b);
      frag.appendChild(li);
    });
    $("list").appendChild(frag);
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
    setStatus(list.length + " CHAdeMO location" + (list.length === 1 ? "" : "s") + " within " + km + " km"
      + (hidden ? " (" + hidden + " hidden as out of service)" : "")
      + ". Community data: confirm status before you drive.", false);
  }

  function locate() {
    if (!navigator.geolocation) {
      setStatus("This browser has no location support. Searching around " + FALLBACK.name + ".", true);
      setOrigin(FALLBACK.lat, FALLBACK.lon);
      map.setView([FALLBACK.lat, FALLBACK.lon], 11);
      search();
      return;
    }
    setStatus("Asking for your location...", false);
    navigator.geolocation.getCurrentPosition(function (pos) {
      setOrigin(pos.coords.latitude, pos.coords.longitude);
      map.setView([origin.lat, origin.lon], 11);
      search();
    }, function () {
      setStatus("Location was blocked or unavailable. Searching around " + FALLBACK.name + ". Move the map and use Search around map center.", true);
      setOrigin(FALLBACK.lat, FALLBACK.lon);
      map.setView([FALLBACK.lat, FALLBACK.lon], 11);
      search();
    }, { timeout: 10000, maximumAge: 60000 });
  }

  $("locate").addEventListener("click", locate);
  $("mapCenter").addEventListener("click", function () {
    var c = map.getCenter();
    setOrigin(c.lat, c.lng);
    search();
  });
  $("radius").addEventListener("change", search);
  $("hideOut").addEventListener("change", search);

  locate(); // the browser asks for location as soon as the page opens
})();
</script>
</body>
</html>
